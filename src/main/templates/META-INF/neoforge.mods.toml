# Mod metadata. Placeholders in dollar-brace form are filled from gradle.properties by the generateModMetadata task.
# Reference: https://docs.neoforged.net/docs/gettingstarted/modfiles

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Jaidenmagnan/miraculous-manatee-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="neetcoders"
description='''
Manatees, penguins and the Manatee Springs biome. Tame a manatee with kelp, let it graze itself fat and
store items in its belly, harvest blubber, and watch out for the evil manatee after dark.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    type="required"
    versionRange="[4.1.0.7,)"
    ordering="AFTER"
    side="BOTH"
